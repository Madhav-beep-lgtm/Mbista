<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — M.Bista</title>
<meta name="theme-color" content="#064e3b">
<link rel="icon" href="/assets/img/favicon.svg">
<style>
    :root { color-scheme: light dark; }
    body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #0c4a6e; color: #fff; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
        max-width: 420px; text-align: center;
        border: 3px solid #d9a33a; border-radius: 16px; padding: 28px 22px;
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 14px; line-height: 1.55; opacity: .92; }
    strong { color: #f4d58d; }
    button {
        min-height: 44px; padding: 0 20px; font-size: 1rem; cursor: pointer;
        border: 0; border-radius: 8px; background: #d9a33a; color: #0c4a6e; font-weight: 700;
    }
</style>
</head>
<body>
<div class="card">
    <h1>No connection</h1>
    <!-- The whole point of this page. An accounting app that "works offline" by
         showing what it remembers is showing a balance from an earlier visit
         with nothing to mark it as old, and somebody takes payment against it.
         So: no figures at all, and say why. -->
    <p>This page is showing <strong>nothing at all</strong> on purpose. Balances, stock and
       outstanding amounts change through the day, and an old figure shown as though it were
       current is worse than no figure.</p>
    <p>Reconnect and try again — anything you had already saved is on the server.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
