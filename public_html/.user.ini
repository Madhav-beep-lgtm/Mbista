; Production PHP performance defaults. Hosts may enforce higher-level values.

; How many fields PHP will read off one POST before it stops and throws the
; rest away WITHOUT a word -- no error, no warning, nothing in any log. The
; multi-bill purchase grid is the form that reaches it: an item line costs 12
; fields, so the stock default of 1000 caps a supplier's bill at about eighty
; items and silently loses everything after that. The grid now refuses a
; truncated submission outright rather than recording half a bill, but the
; honest fix is room: 5000 is about four hundred item lines.
;
; This file is deployed over the document root, so it is the place to change
; it -- an edit made by hand on the server is overwritten by the next deploy.
; PHP caches .user.ini for user_ini.cache_ttl seconds (300 by default), so give
; it five minutes before deciding it did not work.
max_input_vars=5000

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
